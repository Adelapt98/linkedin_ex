<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APT LinkedIn Job Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f2ef;
            color: #1d2226;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            background: #fff;
            border-bottom: 1px solid #dce6f1;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        .header-logo { width: 36px; height: 36px; border-radius: 6px; }
        .header-title { font-size: 20px; font-weight: 700; color: #0a66c2; }
        .header-subtitle { font-size: 13px; color: #666; margin-top: 2px; }

        .badge {
            background: #0a66c2;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ── Toolbar ── */
        .toolbar {
            padding: 18px 32px 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-wrapper { position: relative; flex: 1; min-width: 240px; max-width: 480px; }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #888; }

        #search-input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #search-input:focus {
            border-color: #0a66c2;
            box-shadow: 0 0 0 3px rgba(10,102,194,0.15);
        }

        .filter-select {
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 14px;
            background: #fff;
            outline: none;
            cursor: pointer;
        }

        /* ── Table ── */
        .table-container { padding: 0 32px 40px; overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 6px rgba(0,0,0,0.08);
        }

        thead { background: #f8f9fa; border-bottom: 2px solid #e8edf0; }

        th {
            padding: 13px 16px;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #555f6d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover { color: #0a66c2; }
        th.sorted .sort-arrow { opacity: 1; color: #0a66c2; }
        .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.35; }

        tbody tr { border-bottom: 1px solid #f0f4f8; transition: background 0.12s; }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: #f0f7ff; }

        td { padding: 13px 16px; font-size: 14px; color: #1d2226; vertical-align: middle; }

        .job-title-link {
            color: #0a66c2;
            font-weight: 600;
            text-decoration: none;
            display: block;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .job-title-link:hover { text-decoration: underline; }

        .location-cell { font-size: 13px; color: #555; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .recruiter-link { color: #0a66c2; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 4px; }
        .recruiter-link:hover { text-decoration: underline; }
        .recruiter-name { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .date-cell { font-size: 12px; color: #777; white-space: nowrap; }

        /* Language Pills */
        .lang-pill { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .lang-en      { background: #e8f5e9; color: #2e7d32; }
        .lang-non     { background: #ffebee; color: #d32f2f; }
        .lang-req     { background: #fff3e0; color: #e65100; }
        .lang-unknown { background: #f0f0f0; color: #888; }

        /* Action Buttons */
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.15s, transform 0.1s;
            white-space: nowrap;
        }
        .action-btn:hover { opacity: 0.85; transform: translateY(-1px); }
        .action-btn:active { transform: translateY(0); }
        .btn-job { background: #0a66c2; color: #fff; }
        .btn-del { background: #ffebee; color: #d32f2f; }

        /* Empty state */
        .empty-state { text-align: center; padding: 80px 20px; color: #888; }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
        .empty-state h3 { font-size: 18px; color: #555; margin-bottom: 8px; }
        .empty-state p { font-size: 14px; }

        .row-count { font-size: 13px; color: #888; padding: 0 32px 10px; }

        @media (max-width: 768px) {
            header, .toolbar, .table-container, .row-count { padding-left: 16px; padding-right: 16px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <img class="header-logo" src="icons/icon48.png" alt="logo">
        <div>
            <div class="header-title">APT Job Dashboard</div>
            <div class="header-subtitle">Your LinkedIn jobs at a glance</div>
        </div>
    </div>
    <span class="badge" id="total-badge">0 viewed</span>
</header>

<div class="toolbar">
    <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search by title or location…">
    </div>
    <select class="filter-select" id="lang-filter">
        <option value="all">All Languages</option>
        <option value="en">English only</option>
        <option value="non-en">Non-English only</option>
        <option value="req">Req. Language</option>
    </select>
    <select class="filter-select" id="saved-filter">
        <option value="all">All Jobs</option>
        <option value="saved">Saved only</option>
        <option value="not-saved">Not Saved</option>
    </select>
</div>

<div class="row-count" id="row-count"></div>

<div class="table-container">
    <table id="jobs-table">
        <thead>
            <tr>
                <th data-col="title">Job Title <span class="sort-arrow">↕</span></th>
                <th data-col="location">Location <span class="sort-arrow">↕</span></th>
                <th data-col="ts">Date Viewed <span class="sort-arrow">↓</span></th>
                <th data-col="postedTs">Posted Date <span class="sort-arrow">↕</span></th>
                <th data-col="lang">Language <span class="sort-arrow">↕</span></th>
                <th>Saved?</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="jobs-tbody"></tbody>
    </table>
    <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-icon">👁️</div>
        <h3>No viewed jobs yet</h3>
        <p>Click on any LinkedIn job to read it — it will appear here automatically.</p>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
