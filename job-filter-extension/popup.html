<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Saved Jobs CSV</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 250px;
            padding: 15px;
            margin: 0;
            background-color: #f8f9fa;
        }
        h2 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
            text-align: center;
        }
        p {
            font-size: 14px;
            color: #555;
            text-align: center;
        }
        .stats {
            font-size: 24px;
            font-weight: bold;
            color: #0a66c2;
            margin: 10px 0;
            text-align: center;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 14px;
        }
        #download-btn {
            background-color: #0a66c2;
            color: white;
        }
        #download-btn:hover {
            background-color: #004182;
        }
        #clear-btn {
            background-color: #dc3545;
            color: white;
        }
        #clear-btn:hover {
            background-color: #c82333;
        }
        #clear-btn:disabled {
            background-color: #b0c4de;
            cursor: not-allowed;
        }
        #dashboard-btn {
            background-color: #0a66c2;
            color: white;
        }
        #dashboard-btn:hover {
            background-color: #004182;
        }
        #clear-history-btn {
            background-color: #f0ad4e;
            color: white;
            margin-top: 15px; /* Separate it from CSV tools */
        }
        #clear-history-btn:hover {
            background-color: #ec971f;
        }
        .sync-section {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #ddd;
        }
        .sync-section h3 {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }
        .sync-btns {
            display: flex;
            gap: 8px;
        }
        .sync-btns button {
            flex: 1;
            font-size: 12px;
            padding: 8px 6px;
        }
        #export-btn {
            background-color: #17a2b8;
            color: white;
        }
        #export-btn:hover {
            background-color: #138496;
        }
        #import-btn {
            background-color: #6f42c1;
            color: white;
        }
        #import-btn:hover {
            background-color: #5a32a3;
        }
        .sync-status {
            font-size: 11px;
            color: #555;
            text-align: center;
            margin-top: 6px;
            min-height: 16px;
        }
        .toggle-section {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #ddd;
        }
        .toggle-section h3 {
            font-size: 13px;
            color: #555;
            margin-bottom: 10px;
            text-align: center;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 0;
        }
        .toggle-label {
            font-size: 13px;
            color: #333;
        }
        .toggle-switch {
            position: relative;
            width: 36px;
            height: 20px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 20px;
            transition: 0.2s;
        }
        .toggle-slider:before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle-switch input:checked + .toggle-slider {
            background-color: #0a66c2;
        }
        .toggle-switch input:checked + .toggle-slider:before {
            transform: translateX(16px);
        }
    </style>
</head>
<body>
    <h2>APT LinkedIn Job Search</h2>
    <div class="stats" id="job-count">0</div>
    <p>Jobs saved for export</p>

    <div class="btn-group">
        <button id="dashboard-btn">📊 Open Dashboard</button>
        <button id="download-btn" disabled>📥 Download CSV</button>
        <button id="clear-btn" disabled>🗑️ Clear Saved Jobs</button>
        <button id="clear-history-btn">🧹 Clear Viewing History</button>
    </div>

    <div class="sync-section">
        <h3>📡 Sync across machines</h3>
        <div class="sync-btns">
            <button id="export-btn">📤 Export Data</button>
            <button id="import-btn">📥 Import Data</button>
        </div>
        <div class="sync-status" id="sync-status"></div>
        <input type="file" id="import-file" accept=".json" style="display:none">
    </div>

    <div class="toggle-section">
        <h3>Hide from search results</h3>
        <div class="toggle-row">
            <span class="toggle-label">Hide "Viewed" jobs</span>
            <label class="toggle-switch">
                <input type="checkbox" id="hide-viewed-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
        <div class="toggle-row">
            <span class="toggle-label">Hide "Applied" jobs</span>
            <label class="toggle-switch">
                <input type="checkbox" id="hide-applied-toggle">
                <span class="toggle-slider"></span>
            </label>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
